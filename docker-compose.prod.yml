# Production setup: builds the optimized standalone image and runs it with host
# networking so the scanner can reach the real LAN.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  localdepo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localdepo
    # Host networking lets the scanner reach the real LAN (not just the
    # container's NAT'd bridge subnet). The app listens on host port 3000.
    network_mode: host
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-please-change-me-to-a-long-random-string}
      # Optional: pin the subnet to scan (otherwise auto-detected).
      # - SCAN_CIDR=192.168.1.0/24
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    restart: unless-stopped
